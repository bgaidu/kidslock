name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/**'
  workflow_dispatch:   # 允许在 Actions 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.5（仓库无 gradlew，按 wrapper 配置的版本装）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 编译 Debug APK（debug 签名，可直接安装）
        run: gradle assembleDebug --no-daemon

      - name: 还原签名密钥
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kidslock.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/kidslock.keystore" >> "$GITHUB_ENV"
            echo "密钥已还原"
          else
            echo "未配置签名密钥，跳过 release 构建"
          fi

      - name: 编译 Release APK（正式签名）
        if: env.KEYSTORE_FILE != ''
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: kidslock-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
