name: Build Release APK

on:
  push:
    tags:
      - 'v*'        # 触发：推送 v1.0、v1.1 等标签
  workflow_dispatch: # 手动触发

permissions:
  contents: write   # 上传 Release 资产需要

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK (manual)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1

      - name: 还原发布密钥库
        id: keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > kidslock-release.keystore
          echo "KEYSTORE_FILE=$(pwd)/kidslock-release.keystore" >> $GITHUB_OUTPUT

      - name: 配置 Gradle 签名环境变量
        run: |
          echo "KEYSTORE_FILE=$(pwd)/kidslock-release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: 调试签名配置
        run: |
          echo "=== 签名配置检查 ==="
          echo "KEYSTORE_FILE: $KEYSTORE_FILE"
          echo "KEYSTORE_FILE 存在: $(test -f "$KEYSTORE_FILE" && echo true || echo false)"
          echo "KEYSTORE_PASSWORD 长度: ${#KEYSTORE_PASSWORD}"
          echo "KEY_ALIAS: $KEY_ALIAS"
          echo "KEY_PASSWORD 长度: ${#KEY_PASSWORD}"
          echo "=== keystore 内容 ==="
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1 || true

      - name: 构建 Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 验证 APK 签名
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_OUTPUT
          apksigner verify --print-certs "$APK"

      - name: 创建 GitHub Release 并上传 APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 APK 为 Artifact（非标签触发时）
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: kidslock-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30