plugins {
    id 'com.android.application'
}

// 签名配置：优先使用 CI 环境变量，否则回退到 debug keystore（方便本地构建）
def keystoreFile = System.getenv("KEYSTORE_FILE")
def keystorePass = System.getenv("KEYSTORE_PASSWORD")
def debugKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")

android {
    namespace 'com.kidslock.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.kidslock.app"
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        if (keystoreFile) {
            release {
                storeFile file(keystoreFile)
                storePassword keystorePass
                keyAlias 'kidslock'
                keyPassword keystorePass
            }
        } else if (debugKeystore.exists()) {
            release {
                storeFile debugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile || debugKeystore.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Bundle APK splits for different ABIs - smaller APK for TV
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
}
